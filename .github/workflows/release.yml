name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS · arm64 + x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      - name: Build universal bundles
        run: |
          npm run tauri build -- --target universal-apple-darwin
          npm run tauri build -- --target aarch64-apple-darwin
          npm run tauri build -- --target x86_64-apple-darwin

      # 权限是编译期写进二进制的；缓存（rust-cache）可能留下**上一版**的权限。
      # 发布之前必须逐个架构查一遍 —— 源码改了不等于包里带着修复。
      - name: Verify artifacts
        run: ./scripts/check-artifacts.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist-release
          find src-tauri/target -path '*release/bundle/dmg/*.dmg' -exec cp {} dist-release/ \;
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: ssh7-macos
          path: dist-release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build

      # 只打 NSIS：Tauri 会自己下载 NSIS，不用预装。
      # （MSI 还要额外拉 WiX，收益不大，先不做。）
      - name: cargo tauri build
        run: npm run tauri build -- --bundles nsis

      # 产物自检在 Windows 上查的是「东西在不在」+「编译期标识符对不对」，
      # 不做运行时探针 —— 详见脚本开头的说明。
      - name: Verify artifacts
        shell: bash
        run: bash ./scripts/check-artifacts.sh

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          ls -lh dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: ssh7-windows
          path: dist-release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      # 各平台的产物**各自**上传，再在这里汇总 ——
      # 两个 job 同时往同一个 Release 里塞文件会互相覆盖。
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh dist-release

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          overwrite_files: true
          generate_release_notes: true
          draft: false
