<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSH7 — UI 开发预览（模拟后端）</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      「最近一次开窗请求」的结果。自动化测试直接读它的文本就行，
      不用抢在 toast 消失前截图。
    -->
    <div id="mock-open" style="position: fixed; left: -9999px"></div>
    <!-- 最近一次 listen 注册时带的 target（定向投递的钥匙）。 -->
    <div id="mock-listen-target" style="position: fixed; left: -9999px"></div>
    <!-- 最近一次 emit 实际送达了几个监听器。 -->
    <div id="mock-emit-count" style="position: fixed; left: -9999px"></div>
    <!-- 每个事件注册监听时带的 target。 -->
    <div id="mock-listen-targets" style="position: fixed; left: -9999px"></div>
    <!-- ?selftest=1 的自检结论。 -->
    <div id="mock-selftest" style="position: fixed; left: -9999px"></div>
    <div id="mock-calls" style="position: fixed; left: -9999px"></div>
    <!-- 一共连过几次（自动化测试用来断言「重连真的发生了」）。 -->
    <div id="mock-connect-seq" style="position: fixed; left: -9999px"></div>
    <!-- 最近一次模拟断线的结果。 -->
    <div id="mock-dropped" style="position: fixed; left: -9999px"></div>

    <!--
      仅用于**前端 UI 开发**：用一套假的 Tauri IPC 响应把界面跑起来，
      不需要真的连服务器。生产构建不会包含这个文件。
    -->
    <script>
      ;(function () {
        var hosts = [          {
            id: 'h1',
            label: '生产服务器',
            group: '生产环境',
            host: '10.0.0.8',
            port: 22,
            username: 'root',
            authType: 'password',
            hasPassword: true,
            hasPassphrase: false,
          },
          {
            id: 'h2',
            label: '跳板机',
            group: '生产环境',
            host: '10.0.0.9',
            port: 2222,
            username: 'ops',
            authType: 'privateKey',
            privateKeyPath: '~/.ssh/id_ed25519',
            hasPassword: false,
            hasPassphrase: true,
          },
          {
            id: 'h3',
            label: '测试机',
            group: '测试环境',
            host: '10.0.0.10',
            port: 22,
            username: 'dev',
            authType: 'privateKey',
            privateKeyPath: '~/.ssh/id_ed25519',
            hasPassword: false,
            hasPassphrase: false,
          },
          {
            id: 'h4',
            label: '本地虚拟机',
            host: '127.0.0.1',
            port: 2222,
            username: 'vagrant',
            authType: 'password',
            hasPassword: true,
            hasPassphrase: false,
          },
        ]
        // 分组清单：可以有空分组，决定侧边栏里的顺序。
        var groups = ['生产环境', '测试环境']

        // 多窗口模拟：
        //   mockSessions —— 本窗口里已经建立的会话（按连接配置记）
        //   mockWindows  —— 已经为某台机器开过的窗口
        var mockSessions = []
        var mockWindows = {}

        function clone(info) {
          return {
            sessionId: 's' + Math.random().toString(36).slice(2, 10),
            label: info.label + ' · 副本',
            host: info.host,
            port: info.port,
            username: info.username,
            authType: info.authType,
          }
        }

        // 事件监听表：event -> [{ id, target }]。
        // 真机上这些事件由 Rust 侧 emit 过来，这里做成可手动触发的。
        //
        // **target 要当真**：真机的多窗口靠「事件定向投递」实现 ——
        // Rust 发给 EventTarget::Window{label}，只有用同一个 label
        // 注册的监听器才收得到。mock 必须复现这条规则，否则这类
        // 「连上了却收不到输出」的 bug 在浏览器里根本测不出来。
        var eventHandlers = {}

        // 模拟的窗口标签。真机上由 Tauri 注入。
        var MOCK_WINDOW_LABEL = 'mock-main'

        /** 取出 target 里的窗口标签 —— target 可能是字符串，也可能是对象。 */
        function targetLabel(t) {
          if (!t) return null
          if (typeof t === 'string') return t
          return t.label || null
        }

        /** 每个事件最近一次注册时带的 target（用于断言「定向投递」）。 */
        var listenTargets = {}

        window.__TAURI_INTERNALS__ = {
          // `getCurrentWindow()` 靠它拿到本窗口的标签 ——
          // 前端要拿这个标签去注册定向监听。
          metadata: { currentWindow: { label: MOCK_WINDOW_LABEL } },
          invoke: async function (cmd, args) {
            // 记录每次命令调用 —— 自动化测试用它断言「双击到底调了哪个命令」。
            ;(window.__mockCalls = window.__mockCalls || []).push(cmd)
            var callNote = document.getElementById('mock-calls')
            if (callNote) callNote.textContent = (window.__mockCalls || []).join(',')
            switch (cmd) {
              case 'plugin:event|listen': {
                var a = args || {}
                var hid = a.handler
                ;(eventHandlers[a.event] = eventHandlers[a.event] || []).push({
                  id: hid,
                  // 没给 target 相当于「收所有」（真机上就是 EventTarget::Any）
                  target: a.target || null,
                })
                listenTargets[a.event] = a.target || null
                var note = document.getElementById('mock-listen-targets')
                if (note) note.textContent = JSON.stringify(listenTargets)
                return hid
              }
              case 'plugin:event|unlisten': {
                var u = args || {}
                var list = eventHandlers[u.event]
                if (list) {
                  var i = list.findIndex(function (h) {
                    return h.id === u.eventId
                  })
                  if (i >= 0) list.splice(i, 1)
                }
                return null
              }
              case 'plugin:app|version':
                // 设置面板里显示的版本号。改版本时记得同步这里。
                return '1.9.0'
              case 'host_list':
                return { hosts: hosts.slice(), groups: groups.slice() }
              case 'host_save': {
                var r = (args && args.request) || {}
                var h = r.host || {}
                // 空 id = 新机器，由后端分配 id（真实实现是 UUIDv7）
                if (!h.id) h.id = 'mock-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
                var idx = hosts.findIndex(function (x) {
                  return x.id === h.id
                })
                if (idx >= 0) hosts[idx] = h
                else hosts.push(h)
                if (h.group && groups.indexOf(h.group) < 0) groups.push(h.group)
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_delete': {
                var id = args && args.hostId
                hosts = hosts.filter(function (x) {
                  return x.id !== id
                })
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_group_create': {
                var name = (args && args.name) || ''
                if (name && groups.indexOf(name) < 0) groups.push(name)
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_group_rename': {
                var oldName = (args && args.oldName) || ''
                var newName = (args && args.newName) || ''
                hosts.forEach(function (x) {
                  if ((x.group || '').trim() === oldName) x.group = newName
                })
                var gi = groups.indexOf(oldName)
                if (gi >= 0) {
                  if (groups.indexOf(newName) >= 0) groups.splice(gi, 1)
                  else groups[gi] = newName
                }
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_group_remove': {
                var gname = (args && args.name) || ''
                hosts.forEach(function (x) {
                  if ((x.group || '').trim() === gname) x.group = undefined
                })
                groups = groups.filter(function (g) {
                  return g.trim() !== gname
                })
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_groups_reorder': {
                var order = (args && args.order) || []
                var next = []
                order.forEach(function (n) {
                  if (n && next.indexOf(n) < 0) next.push(n)
                })
                groups.forEach(function (g) {
                  if (next.indexOf(g) < 0) next.push(g)
                })
                groups = next
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'host_move_to_group': {
                var hid = args && args.hostId
                var target = (args && args.group) || ''
                hosts.forEach(function (x) {
                  if (x.id === hid) x.group = target || undefined
                })
                if (target && groups.indexOf(target) < 0) groups.push(target)
                return { hosts: hosts.slice(), groups: groups.slice() }
              }
              case 'session_connect': {
                var r = (args && args.request) || {}
                // 模拟真实握手耗时，好看到「正在连接」那一瞬间的界面。
                // ?delay=3000 可以把它调得更长，用来观察连接中的状态。
                var ms = parseInt(
                  (location.search.match(/[?&]delay=(\d+)/) || [])[1] || '900',
                  10
                )
                // 第几次连接 —— 「重连」就是第二次及以后。
                var seq = (window.__mockConnectSeq = (window.__mockConnectSeq || 0) + 1)
                await new Promise(function (res) {
                  setTimeout(res, ms)
                })
                // ?fail=2 → 从第 2 次连接起都失败（模拟「重连失败」）。
                // ?fail=2,3,4 → 只让第 2/3/4 次失败，第 5 次成功 ——
                //   用来验证「自动重连全挂了之后，手动点一下能救回来」。
                var failRaw = (location.search.match(/[?&]fail=([\d,]+)/) || [])[1] || ''
                var failSeqs = failRaw
                  ? failRaw.split(',').map(function (n) {
                      return parseInt(n, 10)
                    })
                  : []
                // ?failOnce=2 → **只有**第 2 次连接失败，第 3 次就成功。
                var failOnceSeq = parseInt(
                  (location.search.match(/[?&]failOnce=(\d+)/) || [])[1] || '0',
                  10
                )
                var shouldFail =
                  (failOnceSeq && seq === failOnceSeq) ||
                  (failSeqs.length === 1 && seq >= failSeqs[0]) ||
                  (failSeqs.length > 1 && failSeqs.indexOf(seq) >= 0)
                if (shouldFail) {
                  var err = new Error('认证失败：密码错误，或本机没有这台机器的凭据')
                  err.code = 'AUTH_FAILED'
                  err.hint = '检查用户名与密码后重试'
                  throw err
                }
                var sid = 's' + Math.random().toString(36).slice(2, 10)
                // 真实实现里，保存主机时后端会分配 id 并**回传给前端** ——
                // 前端要靠它从加密凭据库里取回密码。前端没带 id 时这里也补一个。
                var hid = r.hostId
                if (!hid && r.save) hid = 'mock-host-' + Date.now()
                // 记下来 —— 「双击开窗」要知道这台机器是不是已经开着。
                mockSessions.push({
                  sessionId: sid,
                  hostId: hid,
                  host: r.host,
                  port: r.port || 22,
                  username: r.username,
                })
                // 连接次数写进 DOM —— 自动化测试靠它断言「重连真的发生了」。
                var seqNote = document.getElementById('mock-connect-seq')
                if (seqNote) seqNote.textContent = String(seq)
                scheduleAutoDrop(sid)
                return {
                  sessionId: sid,
                  label: r.label || r.username + '@' + r.host,
                  host: r.host,
                  port: r.port || 22,
                  username: r.username,
                  authType: r.authType || 'password',
                  hostId: hid,
                }
              }
              case 'session_disconnect': {
                // 真机上「断开连接」后 Rust 会发一个 session://closed ——
                // 前端据此把会话标成已断开。这里得复现，不然测不到
                // 「用户主动断开的**不该**自动重连」这条规则。
                var dsid = (args && args.sessionId) || null
                if (dsid) {
                  window.__mockEmit('session://closed', { sessionId: dsid }, MOCK_WINDOW_LABEL)
                }
                return null
              }
              case 'session_open_in_window': {
                var req = (args && args.request) || {}
                var key =
                  req.hostId ||
                  req.host + ':' + (req.port || 22) + ':' + req.username
                var res
                // 1) 当前窗口里已经有这个会话 → 切标签
                for (var i = 0; i < mockSessions.length; i++) {
                  var ms2 = mockSessions[i]
                  var same = req.hostId
                    ? ms2.hostId === req.hostId
                    : ms2.host === req.host &&
                      ms2.port === (req.port || 22) &&
                      ms2.username === req.username
                  if (same) {
                    res = {
                      action: 'switch',
                      sessionId: ms2.sessionId,
                      window: 'mock-main',
                    }
                    break
                  }
                }
                // 2) 已经为它开过窗 → 聚焦那扇窗
                if (!res && mockWindows[key]) {
                  res = { action: 'focused', window: mockWindows[key] }
                }
                // 3) 都没开着 → 新开一扇
                if (!res) {
                  var wlabel = 'mock-w-' + (Object.keys(mockWindows).length + 1)
                  mockWindows[key] = wlabel
                  res = { action: 'created', window: wlabel }
                }
                // 把结果记在 DOM 上，自动化测试直接读文本就行。
                var note = document.getElementById('mock-open')
                if (note) note.textContent = JSON.stringify(res)
                return res
              }
              case 'window_boot': {
                // ?boot=<hostId> 模拟「这扇窗是专门为这台机器开的」
                var bm = location.search.match(/[?&]boot=([^&]+)/)
                if (!bm) return null
                var bid = decodeURIComponent(bm[1])
                var bh = null
                for (var j = 0; j < hosts.length; j++) {
                  if (hosts[j].id === bid) bh = hosts[j]
                }
                if (!bh) return null
                return {
                  hostId: bh.id,
                  host: bh.host,
                  port: bh.port,
                  username: bh.username,
                  label: bh.label,
                }
              }
              case 'session_clone':
                return clone(hosts[0])
              case 'session_test':
                return { ok: true, latencyMs: 42 }
              case 'sftp_list':
                if (location.search.indexOf('fail') >= 0) {
                  var err = new Error('内部错误')
                  err.code = 'INTERNAL'
                  err.hint = '重试一次；若仍失败，请把下方的错误详情一并反馈'
                  err.detail =
                    'Status(Status { id: 5, status_code: NoSuchFile, error_message: "No such file", language_tag: "" })'
                  throw err
                }
                return [
                  {
                    name: 'logs',
                    path: '/logs',
                    isDirectory: true,
                    isSymlink: false,
                    size: 0,
                    modifiedAt: 1750000000,
                  },
                  {
                    name: 'deploy.sh',
                    path: '/deploy.sh',
                    isDirectory: false,
                    isSymlink: false,
                    size: 4096,
                    modifiedAt: 1750000000,
                  },
                ]
              case 'credential_store_info':
                return {
                  backend: 'vault',
                  backendLabel: '本地加密文件',
                  keyringAvailable: true,
                  isDefault: true,
                  defaultBackend: 'vault',
                }
              case 'credential_store_set': {
                var b = (args && args.backend) || 'vault'
                return {
                  backend: b,
                  backendLabel: b === 'keyring' ? '系统钥匙串' : '本地加密文件',
                  keyringAvailable: true,
                  isDefault: b === 'vault',
                  defaultBackend: 'vault',
                }
              }
              case 'sftp_pick_files':
                return []
              case 'sftp_pick_directory': {
                // ?dir=<路径> → 模拟「用户选了一个本地目录」，这样下载流程能跑起来。
                // 不带这个参数就是「用户取消了」，跟真实行为一致。
                var m = /[?&]dir=([^&]*)/.exec(location.search)
                return m ? decodeURIComponent(m[1]) : null
              }
              case 'sftp_pick_upload_folder': {
                var mf = /[?&]updir=([^&]*)/.exec(location.search)
                return mf ? decodeURIComponent(mf[1]) : null
              }
              case 'sftp_download':
                // ?dl=hang → 永远不结束，方便在浏览器里观察进度提示出现在哪儿。
                if (/[?&]dl=hang/.test(location.search)) return new Promise(function () {})
                return null
              case 'plugin:opener|open_url': {
                // 浏览器预览里没有系统 opener，模拟成新窗口打开。
                window.open(args && args.url, '_blank', 'noopener,noreferrer')
                return null
              }
              default:
                return null
            }
          },
          transformCallback: function (cb) {
            var id = Math.floor(Math.random() * 1e9)
            window['_' + id] = cb
            return id
          },
          unregisterListener: async function () {},
        }
        // @tauri-apps/api 的事件模块用的是这个内部对象
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: async function () {},
        }

        /**
         * 手动触发一个事件 —— 模拟 Rust 侧发来的通知。
         *
         * `toLabel` 是**收件窗口**：只有 target 为空（收所有）或
         * 与它一致的监听器才会收到 —— 和真机的定向投递一个规矩。
         *
         * 比如终端里 `cd` 之后 OSC 7 上报的目录变化：
         *   __mockEmit('session://cwd', { sessionId: 's1', cwd: '/var/log' })
         */
        window.__mockEmit = function (event, payload, toLabel) {
          var handlers = eventHandlers[event] || []
          var delivered = 0
          handlers.forEach(function (h) {
            // 定向投递：target 不为空时，窗口标签对不上就收不到。
            var tLabel = targetLabel(h.target)
            if (tLabel && toLabel && tLabel !== toLabel) return
            var cb = window['_' + h.id]
            if (cb) {
              cb({ event: event, id: h.id, payload: payload })
              delivered++
            }
          })
          var note = document.getElementById('mock-emit-count')
          if (note) note.textContent = String(delivered)
          return delivered
        }

        /**
         * 模拟连接被远端掐断。
         *
         * 真机上这是 `session://closed` 事件 —— 前端据此把会话标成
         * 「已断开」，并尝试自己接回去。
         */
        window.__mockDrop = function (sessionId) {
          var n = window.__mockEmit(
            'session://closed',
            { sessionId: sessionId },
            MOCK_WINDOW_LABEL
          )
          var note = document.getElementById('mock-dropped')
          if (note) note.textContent = sessionId + ':' + n
          return n
        }

        /**
         * ?autodrop=3000 —— 连接成功后 3 秒自动「断开」，
         * 用来在浏览器里观察断开 → 重连的整条链路。
         */
        function scheduleAutoDrop(sid) {
          var dropAfter = parseInt(
            (location.search.match(/[?&]autodrop=(\d+)/) || [])[1] || '0',
            10
          )
          if (!dropAfter) return
          setTimeout(function () {
            window.__mockDrop(sid)
          }, dropAfter)
        }

        /**
         * ?selftest=1 —— 自检「定向投递」这条规则。
         *
         * 真机上 Rust 发 `EventTarget::Window{label}`，只有注册了同一个
         * label 的监听器才收得到；JS 侧若忘了带 target（注册成 Any），
         * 就会出现「连上了却收不到任何输出」的怪事 —— 正是这么翻的车。
         *
         * 这里模拟一遍：发给自己应当送达，发给别的窗口应当收不到。
         */
        if (location.search.indexOf('selftest=1') >= 0) {
          window.addEventListener('load', function () {
            setTimeout(function () {
              var payload = { sessionId: 's1', cwd: '/var/log' }
              var right = window.__mockEmit('session://cwd', payload, MOCK_WINDOW_LABEL)
              var wrong = window.__mockEmit('session://cwd', payload, 'other-window')
              var out = document.getElementById('mock-selftest')
              if (out) {
                out.textContent = JSON.stringify({
                  listenTarget: listenTargets['session://cwd'] || null,
                  toSelf: right,
                  toOther: wrong,
                })
              }
            }, 1500)
          })
        }
      })()
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
